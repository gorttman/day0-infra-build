---
# Plan-only by default. Applying needs BOTH of:
#   -e unifi_tf_do_apply=true
#   -e unifi_tf_approved_plan=<PLAN_SHA printed by the plan-only run>
# A destroy additionally needs -e unifi_tf_allow_destroy=true.
# Mechanics: roles/tf_run. See README.md for the design rationale.
unifi_tf_do_apply: false
unifi_tf_approved_plan: ""
unifi_tf_allow_destroy: false
