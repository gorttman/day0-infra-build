---
# Plan-only by default. Applying needs BOTH of:
#   -e cloudflare_tf_do_apply=true
#   -e cloudflare_tf_approved_plan=<PLAN_SHA printed by the plan-only run>
# so what gets applied is exactly what was reviewed. A destroy additionally
# needs -e cloudflare_tf_allow_destroy=true. Mechanics: roles/tf_run.
cloudflare_tf_do_apply: false
cloudflare_tf_approved_plan: ""
cloudflare_tf_allow_destroy: false
