---
# Terraform runs on the control host through the generic tf_run role (no
# Kubernetes involved - this must work on day 0 and with k3s down). See
# roles/tf_run/ for the mechanics, PLAN_SHA gate and state handling.
- name: Run terraform for the cloudflare stack
  ansible.builtin.include_role:
    name: tf_run
  vars:
    tf_run_stack: cloudflare
    tf_run_src: "{{ playbook_dir }}/roles/cloudflare_tf_apply/files/terraform"
    tf_run_do_apply: "{{ cloudflare_tf_do_apply }}"
    tf_run_approved_plan: "{{ cloudflare_tf_approved_plan }}"
    tf_run_allow_destroy: "{{ cloudflare_tf_allow_destroy }}"
