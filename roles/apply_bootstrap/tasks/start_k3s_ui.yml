---
- name: Expose ArgoCD server via NodePort
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    namespace: argocd
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
        labels:
          app.kubernetes.io/name: argocd-server
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/name: argocd-server
        ports:
          - name: http
            port: 80
            targetPort: 8080
            nodePort: 30080
          - name: https
            port: 443
            targetPort: 8080
            nodePort: "{{ argocd_https_port }}"
  become: true

# Kubernetes Dashboard was removed 2026-08-07: it was a whole
# cluster-admin-capable app, installed via a raw upstream manifest
# (never GitOps-tracked), exposed on the LAN via NodePort, with a
# dedicated cluster-admin ServiceAccount + token printed as bootstrap
# output every rebuild - 281 days of standing attack surface for
# something nobody had used. Argo CD's own UI plus kubectl already
# cover what it was for. See day1-foundation - the retired
# apps/coredns app's README documents the same "things that only look
# fine until something exercises them" audit that found this.

