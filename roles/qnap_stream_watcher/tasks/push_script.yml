################################################################################
# FILE: roles/qnap_stream_watcher/tasks/push_script.yml
################################################################################
---
# Same raw-heredoc pattern as roles/qnap_snapshot/tasks/push_script.yml
# and for the same reason - no Python on the QNAP target. jellyfin_api_key
# is passed in as a play var by qnap-manage.yml (fetched live from the
# arr-stack-wiring-secret k8s Secret), never committed to this repo.
- name: Ensure the script directory exists
  ansible.builtin.raw: >-
    mkdir -p $(dirname {{ qnap_stream_watcher_script_path }})
  changed_when: true

- name: Push the stream-activity watcher script and make it executable
  ansible.builtin.raw: |
    cat > {{ qnap_stream_watcher_script_path }} <<'QNAP_STREAM_WATCHER_EOF'
    #!/bin/sh
    # Generated by day0-infra-build roles/qnap_stream_watcher - edits
    # here will be overwritten on the next Ansible run. Edit
    # variables/play/qnap_stream_watcher.yml and
    # roles/qnap_stream_watcher instead.
    #
    # Polled every {{ qnap_stream_watcher_interval_minutes }} min by cron.
    # Writes/removes a flag file that qnap-snapshot.sh rsync calls
    # check before each source (and, for the long-running sources,
    # mid-run too) to throttle backup bandwidth while someone
    # is actively streaming - see roles/qnap_snapshot/HISTORY.md #5.
    FLAG_FILE={{ qnap_snapshot_throttle_flag_file }}
    RESPONSE=$(wget -q -T 10 -O - --header="X-Emby-Token: {{ jellyfin_api_key }}" "{{ jellyfin_base_url }}/Sessions?activeWithinSeconds=120" 2>/dev/null)
    if [ -z "$RESPONSE" ]; then
      # Jellyfin unreachable or wget failed - leave the flag as it was
      # rather than guess; the next poll in a couple of minutes
      # corrects it either way.
      exit 0
    fi
    # No JSON parser available in the QTS shell, so this is a substring
    # check rather than a real parse - deliberately matches the
    # non-null-object form ("NowPlayingItem":{...}) so an idle-but-
    # logged-in session (NowPlayingItem: null, or the key omitted
    # entirely) does not count as active.
    if echo "$RESPONSE" | grep -q '"NowPlayingItem":{'; then
      touch "$FLAG_FILE"
    else
      rm -f "$FLAG_FILE"
    fi
    QNAP_STREAM_WATCHER_EOF
    chmod +x {{ qnap_stream_watcher_script_path }}
  changed_when: true
