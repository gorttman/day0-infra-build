################################################################################
# FILE: roles/qnap_cron/tasks/write_crontab_entries.yml
################################################################################
---
# ansible.builtin.raw again, not .cron: that module also pushes and
# executes Python on the target, same problem as .file/.copy elsewhere
# in this repo's QNAP roles. Idempotency is hand-rolled here since raw
# gives no structured state to check against - each entry's `name`
# becomes a trailing crontab comment, and the append is skipped if a
# line carrying that comment already exists.
#
# Explicit ADDED/PRESENT markers rather than changed_when: true -
# confirmed live 2026-08-10 that an unconditional changed_when fired
# the crontab-reload handler on every single run regardless of whether
# anything was actually appended, even though the grep guard itself
# was correctly preventing duplicates. Harmless here (a crontab reload
# doesn't interrupt anything, unlike qnap_exports' NFS restart), but
# still an inaccurate changed status worth fixing rather than leaving.
- name: Ensure each cron entry exists in the persistent crontab file
  ansible.builtin.raw: >-
    grep -qF '# {{ item.name }}' {{ qnap_crontab_file }} 2>/dev/null &&
    echo PRESENT || { echo '{{ item.schedule }} {{ item.command }} # {{ item.name }}' >> {{ qnap_crontab_file }}; echo ADDED; }
  loop: "{{ qnap_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  register: cron_entry_check
  changed_when: "'ADDED' in cron_entry_check.stdout"
  notify: Reload QNAP crontab

# Added 2026-11-01. Comments out stock QNAP crontab lines we do not want,
# listed in qnap_cron_disabled. Matches the command at the end of an
# active (not already commented) line, so re-running is a no-op. Only the
# persistent file is edited; the reload handler loads it into crond.
# default([]) so plays that do not define the list are unaffected.
- name: Ensure unwanted stock cron entries are commented out
  ansible.builtin.raw: >-
    if grep -qE '^[^#].* {{ item.command }}$' {{ qnap_crontab_file }} 2>/dev/null; then
    sed -i '\|^[^#].* {{ item.command }}$|s|^|# DISABLED ({{ item.name }}) |' {{ qnap_crontab_file }}; echo DISABLED;
    else echo ABSENT_OR_DONE; fi
  loop: "{{ qnap_cron_disabled | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: cron_disable_check
  changed_when: "'DISABLED' in cron_disable_check.stdout and 'ABSENT' not in cron_disable_check.stdout"
  notify: Reload QNAP crontab
