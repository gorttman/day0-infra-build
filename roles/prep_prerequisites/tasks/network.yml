---
# === WiFi management interface ===
# Skipped gracefully if credentials/wifi/ssid does not exist.
# On first rebuild: copy credentials/wifi/{ssid,psk} onto the Pi
# (same step as credentials/git-pat/token.txt) then run Ansible.

- name: Check for WiFi credential files
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/credentials/wifi/ssid"
  register: wifi_cred_stat

- name: Configure WiFi management interface
  when: wifi_cred_stat.stat.exists
  become: true
  block:
    - name: Read WiFi SSID
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/credentials/wifi/ssid"
      register: wifi_ssid_raw

    - name: Read WiFi PSK
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/credentials/wifi/psk"
      register: wifi_psk_raw

    - name: Configure WiFi NM connection
      community.general.nmcli:
        conn_name: wifi-mgmt
        ifname: wlan0
        type: wifi
        ssid: "{{ wifi_ssid_raw.content | b64decode | trim }}"
        wifi_sec:
          key-mgmt: wpa-psk
          psk: "{{ wifi_psk_raw.content | b64decode | trim }}"
        autoconnect: true
        state: present

    - name: Bring up WiFi connection
      ansible.builtin.command: nmcli connection up wifi-mgmt
      register: wifi_up
      changed_when: "'successfully activated' in wifi_up.stdout"
      failed_when: wifi_up.rc != 0 and 'already active' not in wifi_up.stderr

# === DNS resilience on the wireless management interface ===
# Deliberately NOT gated on the wifi-mgmt block above, and doesn't
# assume that connection's name: on this host (k8smaster), the
# credentials/wifi/ssid file has never existed, so that block has
# never run, and wlan0 is instead managed by a connection profile the
# Raspberry Pi Imager itself pre-baked at flash time, named after the
# SSID ("ARDA_HOME") - not "wifi-mgmt". Confirmed live 2026-08-07.
# Discovering the real active wireless connection name here means
# this keeps working whether the profile came from the block above or
# from the imager.
#
# Why this matters at all: without it, wlan0 resolves *.i3sec.com.au
# via the router/public DNS, which has no idea about the internal
# split-horizon record and sends every request out through Cloudflare's
# public edge and its WAF instead of straight to the LAN service. Pi-hole
# stays first in the list, not the only entry - this same host runs
# Pi-hole's own pod, so it's also the machine you'd reach for to fix
# Pi-hole if Pi-hole were the thing broken, and it needs to keep
# resolving names either way.

- name: Discover the active wireless connection name
  ansible.builtin.command: nmcli -t -f NAME,TYPE connection show --active
  register: active_connections
  changed_when: false

- name: Set wireless connection name fact
  ansible.builtin.set_fact:
    wifi_conn_name: "{{ (active_connections.stdout_lines
      | select('search', ':802-11-wireless$')
      | map('regex_replace', ':802-11-wireless$', '')
      | list) | first | default(omit) }}"

- name: Ensure Pi-hole is the primary DNS server on the wireless connection
  when: wifi_conn_name is defined
  become: true
  block:
    - name: Set DNS servers on the wireless connection
      community.general.nmcli:
        conn_name: "{{ wifi_conn_name }}"
        type: wifi
        dns4: "{{ wifi_mgmt_dns }}"
        dns4_ignore_auto: true
        state: present

    - name: Reapply the wireless connection to pick up the DNS change
      ansible.builtin.command: "nmcli connection up {{ wifi_conn_name }}"
      register: wifi_dns_up
      changed_when: "'successfully activated' in wifi_dns_up.stdout"
      failed_when: wifi_dns_up.rc != 0 and 'already active' not in wifi_dns_up.stderr

# === Backend VLAN static IP (end0) ===

- name: Configure static IP on end0 for backend VLAN
  community.general.nmcli:
    conn_name: backend-vlan
    ifname: end0
    type: ethernet
    ip4: "{{ backend_vlan_ip }}/{{ backend_vlan_prefix }}"
    never_default4: true
    autoconnect: true
    state: present
  become: true

- name: Bring up backend-vlan connection
  ansible.builtin.command: nmcli connection up backend-vlan
  become: true
  register: nmcli_up
  changed_when: "'successfully activated' in nmcli_up.stdout"
  failed_when: nmcli_up.rc != 0 and 'already active' not in nmcli_up.stderr
