---
- name: Check hosts file is accurate
  ansible.builtin.include_tasks: 
    file: hosts.yml

- name: Check if cgroups is configured correctly
  ansible.builtin.include_tasks:
    file: cgroups.yml

- name: Configure network interfaces
  ansible.builtin.include_tasks:
    file: network.yml

- name: Tune kernel sysctls for k3s node density
  ansible.builtin.include_tasks:
    file: sysctl.yml

- name: Configure NTP
  ansible.builtin.include_tasks:
    file: timesyncd.yml
