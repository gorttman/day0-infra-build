---
- name: Pin QNAP wired-face FQDN and short name in local /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ qnap_wired_ip }} {{ qnap_fqdn }} {{ qnap_short }}"
    regexp: '\s{{ qnap_fqdn | regex_escape }}\s*$'
    state: present

- name: Check whether the netboot shared root image exists
  ansible.builtin.stat:
    path: "{{ netboot_root_path }}/etc/hosts"
  register: netboot_hosts

- name: Pin QNAP wired-face FQDN and short name in the netboot root image (seeds new nodes)
  ansible.builtin.lineinfile:
    path: "{{ netboot_root_path }}/etc/hosts"
    line: "{{ qnap_wired_ip }} {{ qnap_fqdn }} {{ qnap_short }}"
    regexp: '\s{{ qnap_fqdn | regex_escape }}\s*$'
    state: present
  when: netboot_hosts.stat.exists

- name: Find per-node /etc overlays (live pinodes mount these over /etc)
  ansible.builtin.find:
    paths: "{{ netboot_cluster_path }}"
    patterns: hosts
    recurse: true
    depth: 3
  register: node_etc_hosts

- name: Pin QNAP wired-face FQDN and short name in each per-node /etc overlay
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    line: "{{ qnap_wired_ip }} {{ qnap_fqdn }} {{ qnap_short }}"
    regexp: '\s{{ qnap_fqdn | regex_escape }}\s*$'
    state: present
  loop: "{{ node_etc_hosts.files | selectattr('path', 'search', '/etc/hosts$') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure /mnt/ mount points exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    # No mode: - meaningless once NFS is mounted over the path anyway
    # (permissions come from the remote export), and enforcing one here
    # breaks idempotency on re-runs against an already-mounted /backup:
    # its export root's permission mapping rejects chmod even as root
    # ("Operation not permitted", confirmed live 2026-07-21) the way the
    # other 9 exports' more permissive roots don't.
  loop: "{{ qnap_host_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure host-level QNAP mounts (fstab + mounted)
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ qnap_short }}:{{ item.export }}"
    fstype: nfs
    # nofail: a QNAP outage/reboot must not hang k8smaster's own boot
    # waiting on this mount - systemd honours it for fstab-derived
    # mount units the way `bg` (the old NFS-helper-level retry option,
    # dropped here) never reliably did.
    opts: "nfsvers=4,_netdev,noatime,nofail"
    state: mounted
  loop: "{{ qnap_host_mounts }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.export }}"

- name: Ensure off-box credentials backup destination exists on the QNAP
  # k8smaster only: the source directories for this live there and
  # nowhere else. Before pinode-01 joined the inventory `hosts: all`
  # meant one host, so these needed no condition.
  when: inventory_hostname == 'k8smaster'
  ansible.builtin.file:
    path: "{{ credentials_backup_dest }}"
    state: directory
    mode: "0700"

# credentials/ (git PAT, sealed-secrets key backups) was gitignored -
# correctly, it's real plaintext secrets - but that also meant it lived
# nowhere but this one host's disk. rebuild-runbook.md's Step 2 assumed
# "your secure backup" already existed; it didn't. This closes that gap
# the same way the sealed-secrets CronJob fix did: a plain
# ansible.builtin.cron entry, not a self-rewriting script (that pattern
# is what silently died last time - see docs/rebuild-gap-audit.md item 2).
- name: Install daily off-box sync of credentials/ to the QNAP
  # k8smaster only: the source directories for this live there and
  # nowhere else. Before pinode-01 joined the inventory `hosts: all`
  # meant one host, so these needed no condition.
  when: inventory_hostname == 'k8smaster'
  ansible.builtin.cron:
    name: "Sync day0-infra-build credentials/ to QNAP backup share"
    minute: "30"
    hour: "4"
    # mountpoint guard: the /mnt/ mount above uses nofail/_netdev
    # deliberately (a QNAP outage must not hang boot), but that also
    # means a dead mount fails silent rather than loud - a stuck mount
    # would otherwise leave rsync happily syncing into a plain empty
    # local directory instead of the QNAP, indefinitely, with nothing
    # ever erroring. Confirmed live 2026-08-08 that this actually
    # happens (a QNAP-side NFS restart dropped this exact mount and
    # nothing noticed until checked by hand) - refuse and log loudly
    # instead, same "fail loud not silent" principle as
    # restore_sealed_secrets_key.yml's staleness assert.
    # -rlpt not -a: skips owner/group preservation (-o -g), which the QNAP
    # export's UID mapping rejects with "Operation not permitted" even
    # when run as root (confirmed live) - content transfers fine either
    # way, only ownership metadata was ever at issue.
    job: >-
      if mountpoint -q {{ credentials_backup_dest | dirname }}; then
      rsync -rlpt --delete {{ playbook_dir }}/credentials/ {{ credentials_backup_dest }}/
      >> /var/log/credentials-backup-sync.log 2>&1; else
      echo "$(date -Iseconds) ERROR: {{ credentials_backup_dest | dirname }} is not mounted - refusing to sync, this would otherwise write to local disk" >> /var/log/credentials-backup-sync.log; fi

# Real, live incident 2026-08-22: a QNAP reboot silently wiped
# /backup's entire NFS export registration (all 6 nfssetting sections -
# QTS evidently re-registers external/USB storage exports fresh on
# every boot, unlike fixed internal-pool volumes, which survived the
# same reboot untouched). postgres-backup wrote directly to /mnt/backup
# via hostPath, so the CronJob just hung for its full 30-minute
# activeDeadlineSeconds and failed, three nights running, before this
# was even noticed. Decoupling "did tonight's dump succeed" from "is
# the QNAP export currently reachable" this way means the dump itself
# no longer depends on QNAP/NFS state at all - only this separate sync
# step does, and it fails loud (same mountpoint-guard pattern as
# credentials-sync above) rather than hanging a Job.
- name: Ensure postgres-backup's local staging directory exists with correct ownership
  # k8smaster only: the source directories for this live there and
  # nowhere else. Before pinode-01 joined the inventory `hosts: all`
  # meant one host, so these needed no condition.
  when: inventory_hostname == 'k8smaster'
  ansible.builtin.file:
    path: "{{ postgres_backup_staging_dir }}"
    state: directory
    owner: "{{ postgres_backup_staging_uid }}"
    group: "{{ postgres_backup_staging_gid }}"
    mode: "0755"

# Deliberately a plain cron entry, not folded into the CronJob's own
# container - postgres-backup's image is plain postgres:16.9-alpine,
# no SSH/rsync-to-remote capability, and adding that to a database
# image is more surface area than reusing what's already proven here
# for exactly this shape of problem (credentials-sync above).
# --delete makes the QNAP side a mirror of local staging, so
# backup.sh's own daily/weekly/monthly pruning (which now runs against
# local disk) is what actually controls retention on both ends - this
# step only ever reconciles, never decides what to keep.
- name: Install sync of postgres-backup staging to the QNAP
  # k8smaster only: the source directories for this live there and
  # nowhere else. Before pinode-01 joined the inventory `hosts: all`
  # meant one host, so these needed no condition.
  when: inventory_hostname == 'k8smaster'
  ansible.builtin.cron:
    name: "Sync postgres-backup staging to QNAP"
    minute: "45"
    hour: "2"
    job: >-
      if mountpoint -q {{ postgres_backup_sync_dest | dirname | dirname }}; then
      rsync -rlpt --delete {{ postgres_backup_staging_dir }}/ {{ postgres_backup_sync_dest }}/
      >> /var/log/postgres-backup-sync.log 2>&1; else
      echo "$(date -Iseconds) ERROR: {{ postgres_backup_sync_dest | dirname | dirname }} is not mounted - refusing to sync, this would otherwise write to local disk" >> /var/log/postgres-backup-sync.log; fi

# etcd snapshots were the one backup stream with no off-box copy at all
# (found 2026-09-04): k3s kept 5 locally and nothing ever moved them, so
# the snapshots would have died with the disk they protect against.
# Same mountpoint-guard shape as the credentials sync above - a silently
# dead /mnt/backup must fail loud, not fill local disk. No --delete: k3s
# prunes to 5 locally and mirroring that would discard history on every
# rotation, so the destination prunes on its own count instead.
- name: Install off-box sync of etcd snapshots to the QNAP
  # k8smaster only: the source directories for this live there and
  # nowhere else. Before pinode-01 joined the inventory `hosts: all`
  # meant one host, so these needed no condition.
  when: inventory_hostname == 'k8smaster'
  ansible.builtin.cron:
    name: "Sync k3s etcd snapshots to QNAP backup share"
    minute: "0"
    hour: "5"
    job: >-
      if mountpoint -q {{ etcd_snapshot_backup_dest | dirname }}; then
      mkdir -p {{ etcd_snapshot_backup_dest }} &&
      rsync -rlpt {{ etcd_snapshot_src }}/ {{ etcd_snapshot_backup_dest }}/
      >> /var/log/etcd-snapshot-sync.log 2>&1 &&
      ls -1t {{ etcd_snapshot_backup_dest }}/etcd-snapshot-* 2>/dev/null
      | tail -n +{{ etcd_snapshot_backup_keep | int + 1 }} | xargs -r rm -f; else
      echo "$(date -Iseconds) ERROR: {{ etcd_snapshot_backup_dest | dirname }} is not mounted - refusing to sync, this would otherwise write to local disk" >> /var/log/etcd-snapshot-sync.log; fi
