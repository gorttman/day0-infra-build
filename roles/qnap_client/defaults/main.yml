---
# QNAP NAS client configuration for cluster nodes.
#
# 2026-08-30: QNAP consolidated to a single interface (Trusted/VLAN20,
# 192.168.20.30) as part of the VLAN20 backend migration (see
# day0-infra-build's effervescent-squishing-token plan / memory
# project_vlan20_backend_migration) - the "wired face vs WLAN face"
# split described below no longer reflects two different real
# addresses (both now resolve the same IP), but the /etc/hosts pinning
# itself stays authoritative and load-bearing, unrelated to that split:
# - cluster nodes deliberately do NOT use Pi-hole for their own
#   resolution (DNS chicken-and-egg - see day1 pihole notes), and
# - kubelet performs NFS PersistentVolume mounts with the NODE's
#   resolver, so every node that may run a QNAP-mounting pod must
#   resolve this name;
# - WLAN itself is on a deprecation path - Pi-hole's own record now
#   just mirrors this for non-cluster/general clients, it is not the
#   source of truth for either name.
#
# Known gap: this role has only ever been run against k8smaster
# (variables/cli/hosts.ini) - pinode-01 is missing this pinning
# entirely as of 2026-08-30, applied live as a one-off fix, not yet
# via this role. Needs pinode-01 added as a real target.
#
# qnap_short added 2026-08-07: a bare hosts-file name, deliberately not
# DNS-resolvable at all, so any consumer using it can never silently
# fall back to a public/WLAN-facing answer the way the FQDN briefly
# looked like it might (see the getent-hosts-vs-ahostsv4 IPv6 note
# below) - it only ever resolves to the wired-face IP pinned here, or
# fails outright. New NFS mount specs (k8s PersistentVolumes, fstab
# entries) should prefer this over the FQDN going forward.
#
# Both names are IPv4-only in /etc/hosts. `getent hosts` (which queries
# both address families) falls through to public DNS for the missing
# AAAA record on qnap.i3sec.com.au - a real, registered domain with its
# own unrelated public DNS - and returns real Cloudflare IPv6
# addresses, nothing to do with this QNAP. Confirmed harmless for
# actual NFS mounting (`getent ahostsv4` / explicit AF_INET resolution
# correctly returns the wired IP on both nodes, 2026-08-07) since this
# LAN is IPv4-only throughout, but worth knowing if anything here ever
# starts preferring IPv6.
qnap_fqdn: qnap.i3sec.com.au
qnap_short: qnap
qnap_wired_ip: 192.168.20.30

# Shared NFS root image used by all diskless pinodes - pinning the name
# here covers every netboot node at once.
netboot_root_path: /srv/nfs/rpios/latest
# Per-node overlays; each live pinode NFS-mounts <node>/etc over /etc,
# so the image pin alone does not reach running nodes.
netboot_cluster_path: /srv/nfs/cluster

# Host-level mounts on the machine running this play (k8smaster).
# Separate from pod storage - apps claim QNAP exports via
# PersistentVolumes (day1-foundation apps/qnap-storage), which mount
# per-pod on whichever node schedules the workload. These are for
# host-level access to the same shares directly from k8smaster (e.g.
# admin/backup tooling), not consumed by cluster pods.
#
# Export paths are bare top-level names (e.g. /books), NOT prefixed
# with /public_root - confirmed via `showmount -e qnap.i3sec.com.au`
# and a real test mount (2026-07-14). The qnap-books PV's
# /public_root/books path does NOT work as a fresh mount despite being
# what the live Kavita pod still uses - see day1-foundation
# apps/qnap-storage for that separate, pre-existing issue.
qnap_host_mounts:
  - path: /mnt/inbox
    export: /inbox
  - path: /mnt/photos
    export: /photos
  - path: /mnt/immich
    export: /immich
  - path: /mnt/books
    export: /books
  - path: /mnt/media
    export: /media
  - path: /mnt/paperless
    export: /paperless
  - path: /mnt/vault
    export: /vault
  - path: /mnt/cold
    export: /cold
  - path: /mnt/downloads
    export: /downloads
  - path: /mnt/backup
    export: /backup
  # Added 2026-08-13 alongside the pihole/calibre-web main-pool
  # migration - restore.sh's non-scratch qnap-data restore path needs a
  # live host mount to rsync back into, same as every other source.
  - path: /mnt/pihole
    export: /pihole
  - path: /mnt/calibre-web
    export: /calibre-web
  # Public was a pre-existing manual /etc/fstab entry, not managed by
  # this role at all - and not by the wired-face short name either
  # (192.168.2.30, the WLAN face). Found and fixed 2026-08-07 during
  # the same short-name migration - added here so a future rebuild
  # actually recreates it instead of silently losing it.
  - path: /mnt/nfs
    export: /Public

# Where k8smaster's own credentials/ directory (git PAT, sealed-secrets
# key backups - see day0-infra-build/docs/rebuild-runbook.md Step 2) gets
# rsynced daily, off this host's disk. /backup is a pre-existing,
# substantial personal media/data share on the QNAP (Books/Movies/TV/
# Photo/Data already live at its root) - not a dedicated empty backup
# target - so this gets its own clearly-named subdirectory rather than
# landing at the export root.
credentials_backup_dest: /mnt/backup/k8smaster-credentials

# k3s writes etcd snapshots here every 12h and keeps 5. They never left
# this host until 2026-09-04, so an NVMe failure took all cluster state
# with it despite snapshots existing.
etcd_snapshot_src: /var/lib/rancher/k3s/server/db/snapshots
etcd_snapshot_backup_dest: /mnt/backup/k8smaster-etcd-snapshots
etcd_snapshot_backup_keep: 14

# postgres-backup's local staging directory on k8smaster - see the
# staging-then-sync task below for why. Not under /mnt/ deliberately:
# that prefix means "an actual external mount" everywhere else in this
# role, and this is real local disk on purpose.
postgres_backup_staging_dir: /var/lib/postgres-backup-staging
# Same uid/gid the postgres-backup CronJob's securityContext runs as
# (day2-services apps/postgres/postgres-backup-cronjob.yml) - the
# container writes as this uid via hostPath, unmapped, same as it
# always has been against the QNAP export.
postgres_backup_staging_uid: 70
postgres_backup_staging_gid: 70
postgres_backup_sync_dest: /mnt/backup/active_backup/postgres
