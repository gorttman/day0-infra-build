################################################################################
# FILE: roles/qnap_backup_dirs/tasks/set_ownership.yml
################################################################################
---
# Separate pass from ensure_directory.yml rather than one combined
# mkdir-&& chown command: the /backup export's squash mapping has
# already been observed to reject writes from a mismatched uid (root
# included - see roles/qnap_client/tasks/main.yml's mode: comment), so
# a wrong uid/gid here is a distinct, separately-diagnosable failure
# from the directory simply not existing.
- name: Ensure each backup stream's directory has the correct owner
  ansible.builtin.raw: >-
    chown {{ item.uid }}:{{ item.gid }} '{{ qnap_backup_disk_root }}/{{ item.path }}'
  loop: "{{ qnap_backup_dirs }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.uid }}:{{ item.gid }}"
  changed_when: true
