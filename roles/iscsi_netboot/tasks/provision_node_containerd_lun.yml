---
# Provisions one node's containerd-storage LUN/target - see defaults/
# main.yml's header comment on iscsi_node_containerd_lun_capacity_gb for
# why this LUN exists alongside the delta LUN, not instead of it (they
# solve two different problems: the delta LUN is the overlay's writable
# upper layer, this LUN is a genuinely separate real-ext4 filesystem
# containerd's own overlayfs snapshotter needs, since overlay-on-overlay
# isn't a supported kernel combination). Starts empty -
# /scripts/iscsi-overlay formats it on the node's own actual first boot,
# same as the delta LUN; this task only makes sure the QNAP-side
# target/LUN/ACL exist.
#
# Requires the same two vars as provision_node_delta_lun.yml:
# node_mac_suffix and node_initiator_iqn. See that file's header comment
# for the run_once/become explanations - identical reasoning applies to
# every task below, not repeated here.

- name: Log in to QCLI
  ansible.builtin.include_tasks: qcli_login.yml
  run_once: true

- name: Check existing targets
  ansible.builtin.raw: /sbin/qcli_iscsi -L
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  register: node_containerd_target_check
  changed_when: false

- name: Create this node's containerd-storage target
  ansible.builtin.raw: >-
    /sbin/qcli_iscsi -C Alias={{ iscsi_node_containerd_target_name }} Name={{ iscsi_node_containerd_target_name }}
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  when: iscsi_node_containerd_target_name not in node_containerd_target_check.stdout
  changed_when: true

- name: Check existing LUNs
  ansible.builtin.raw: /sbin/qcli_iscsi -l
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  register: node_containerd_lun_check
  changed_when: false

- name: Create this node's containerd-storage LUN (file-based - see role defaults)
  ansible.builtin.raw: >-
    /sbin/qcli_iscsi -c Name={{ iscsi_node_containerd_lun_name }}
    Capacity={{ iscsi_node_containerd_lun_capacity_gb }}
    Allocation=Instant
    LUNType=File volumeID={{ qnap_iscsi_volume_id }}
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  when: iscsi_node_containerd_lun_name not in node_containerd_lun_check.stdout
  changed_when: true

- name: Re-check target list to find this node's containerd target ID
  ansible.builtin.raw: /sbin/qcli_iscsi -L
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  register: node_containerd_target_list
  changed_when: false

- name: Re-check LUN list to find this node's containerd LUN ID
  ansible.builtin.raw: /sbin/qcli_iscsi -l
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  register: node_containerd_lun_list
  changed_when: false

- name: Extract this node's containerd target ID
  ansible.builtin.set_fact:
    node_containerd_target_id: >-
      {{ node_containerd_target_list.stdout
         | regex_search('targetID\s+(\d+)\s*\n\s*TargetIQN\s+\S*' + iscsi_node_containerd_target_name, '\1')
         | first }}
  run_once: true

- name: Extract this node's containerd LUN ID
  ansible.builtin.set_fact:
    node_containerd_lun_id: >-
      {{ node_containerd_lun_list.stdout
         | regex_search('(\d+)\s+--\s+\S+\s+--\s+' + iscsi_node_containerd_lun_name, '\1')
         | first }}
  run_once: true

- name: Check whether this node's containerd LUN is already mapped to its target
  ansible.builtin.raw: /sbin/qcli_iscsi -I targetID={{ node_containerd_target_id }}
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  register: node_containerd_lun_mapping_check
  changed_when: false

# qcli_iscsi -m is NOT idempotent at the underlying LIO/configfs level -
# see provision_node_lun.yml's identical guard for the full story.
- name: Map this node's containerd LUN to its target (skipped if already mapped)
  ansible.builtin.raw: >-
    /sbin/qcli_iscsi -m lunID={{ node_containerd_lun_id }} targetID={{ node_containerd_target_id }}
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  when: >-
    not (node_containerd_lun_mapping_check.stdout
         | regex_search('LunID\s+' + node_containerd_lun_id + '(\s|$)', multiline=True))
  changed_when: true

# QTS auto-generates the IQN suffix on target creation - read back
# rather than reconstructed. The overlay cmdline render consumes this
# fact - it must run after this task in the same play, not standalone.
- name: Extract this node's containerd target's real IQN
  ansible.builtin.set_fact:
    node_containerd_target_iqn: >-
      {{ (node_containerd_target_list.stdout
          | regex_search('TargetIQN\s+(\S*' + iscsi_node_containerd_target_name + '\S*)', '\1'))
          | first }}
  run_once: true

- name: Grant this node's own initiator ACL on the containerd target
  ansible.builtin.raw: >-
    /sbin/qcli_iscsi -A targetID={{ node_containerd_target_id }}
    initiatorIQN={{ node_initiator_iqn }} initiatorAlias={{ node_mac_suffix }}
  delegate_to: "{{ groups['qnap'][0] }}"
  become: false
  run_once: true
  register: containerd_acl_add
  changed_when: "'ok' in containerd_acl_add.stdout"
  failed_when: containerd_acl_add.rc != 0 and 'already' not in containerd_acl_add.stdout

# Deliberately NOT removing the "Default Policy" wildcard initiator
# entry - see provision_node_lun.yml's identical comment on this same
# QTS 4.3.4 firmware quirk.
