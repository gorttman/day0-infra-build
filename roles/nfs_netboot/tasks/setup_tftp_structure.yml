################################################################################
# FILE: roles/nfs_netboot/tasks/setup_tftp_structure.yml
################################################################################
---
# Boot files shared across all Pi 5 nodes.
- name: Set Pi 5 boot file list
  ansible.builtin.set_fact:
    pi5_boot_files:
      - start4.elf
      - bootcode.bin
      - kernel_2712.img
      - kernel8.img
      - bcm2712-rpi-5-b.dtb
      - initramfs_2712
      - initramfs8

# === Shared base/ directory — copied once, or on force_boot_files: true ===
- name: Create TFTP root and base/ directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ tftp_root }}"
    - "{{ tftp_root }}/base"

- name: Stat base boot files
  ansible.builtin.stat:
    path: "{{ tftp_root }}/base/{{ item }}"
  loop: "{{ pi5_boot_files }}"
  register: base_file_stats

- name: Copy shared boot files to base/ (skip if present)
  ansible.builtin.copy:
    src: "{{ nfs_os_path }}/boot/firmware/{{ item.item }}"
    dest: "{{ tftp_root }}/base/{{ item.item }}"
    mode: '0644'
    remote_src: true
  loop: "{{ base_file_stats.results }}"
  when: not item.stat.exists or (force_boot_files | default(false))
  loop_control:
    label: "base/{{ item.item }}"

- name: Stat base firmware overlay directory
  ansible.builtin.stat:
    path: "{{ tftp_root }}/base/firmware"
  register: base_firmware_stat

- name: Copy firmware overlay directory to base/ (skip if present)
  ansible.builtin.copy:
    src: "{{ nfs_os_path }}/boot/firmware/"
    dest: "{{ tftp_root }}/base/firmware/"
    mode: preserve
    remote_src: true
  when: not base_firmware_stat.stat.exists or (force_boot_files | default(false))

# === Per-node directories — symlinks + rendered config ===
- name: Create per-node TFTP directories
  ansible.builtin.file:
    path: "{{ tftp_root }}/{{ item.name }}"
    state: directory
    mode: '0755'
  loop: "{{ nodes | default([]) }}"
  when: (nodes | default([])) | length > 0

- name: Symlink per-node boot files to base/
  ansible.builtin.file:
    src: "../base/{{ item.1 }}"
    dest: "{{ tftp_root }}/{{ item.0.name }}/{{ item.1 }}"
    state: link
    force: true
  loop: "{{ (nodes | default([])) | product(pi5_boot_files) | list }}"
  when: (nodes | default([])) | length > 0
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"

- name: Symlink firmware overlay directory to base/
  ansible.builtin.file:
    src: "../base/firmware"
    dest: "{{ tftp_root }}/{{ item.name }}/firmware"
    state: link
    force: true
  loop: "{{ nodes | default([]) }}"
  when: (nodes | default([])) | length > 0

# Separate from the firmware symlink above, not redundant with it -
# confirmed 2026-08-16 the hard way this was missing the whole time: the
# Pi firmware fetches dtoverlay=... files via TFTP at "overlays/<name>.dtbo",
# relative to the boot directory itself, NOT "firmware/overlays/<name>.dtbo".
# Without this symlink, every dtoverlay= line in config.txt silently
# 404s and gets skipped - no error anywhere, config.txt's other
# settings (kernel filename, arm_64bit, etc.) all still apply fine, so
# nothing about the boot looks broken unless you specifically need an
# overlay's effect and go looking for why it never happened.
- name: Symlink overlays directory to base/firmware/overlays (see comment above - separate path the firmware actually fetches from)
  ansible.builtin.file:
    src: "../base/firmware/overlays"
    dest: "{{ tftp_root }}/{{ item.name }}/overlays"
    state: link
    force: true
  loop: "{{ nodes | default([]) }}"
  when: (nodes | default([])) | length > 0

# cmdline.txt.j2 deliberately carries no "FILE:" header comment unlike
# every other template in this repo - the RPi firmware/kernel parses
# this file as raw space-separated boot parameters, not a file with
# comment support. A header line here was confirmed 2026-08-14 to
# render literally into the live file, undetected for an unknown
# period because pinode-01 had 35+ days of uptime and never rebooted
# to actually exercise a freshly-rendered cmdline.txt until the same
# investigation that found the vers=4.2 bug. Keep the template pristine
# - put any future explanation here, in the task, not in the template.
- name: Render cmdline.txt for each node
  ansible.builtin.template:
    src: cmdline.txt.j2
    dest: "{{ tftp_root }}/{{ item.name }}/cmdline.txt"
    mode: '0644'
  loop: "{{ nodes | default([]) }}"
  when: (nodes | default([])) | length > 0

- name: Render config.txt for each node
  ansible.builtin.template:
    src: config.txt.j2
    dest: "{{ tftp_root }}/{{ item.name }}/config.txt"
    mode: '0644'
  loop: "{{ nodes | default([]) }}"
  when: (nodes | default([])) | length > 0
