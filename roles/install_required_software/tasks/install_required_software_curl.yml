- name: Install k3s via curl
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s
  become: true

- name: Check whether kubeseal is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/kubeseal
  register: kubeseal_bin

- name: Download kubeseal binary (ARM64 for Raspberry Pi 5)
  when: not kubeseal_bin.stat.exists
  get_url:
    url: https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/kubeseal-0.27.1-linux-arm64.tar.gz
    dest: /tmp/kubeseal.tar.gz
    mode: '0644'

