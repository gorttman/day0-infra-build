---
# Installs the nightly, read-only drift check on k8smaster. Plan only: the
# script never passes an apply flag. See files/infra-drift-check.
- name: Install the drift check script
  ansible.builtin.copy:
    src: infra-drift-check
    dest: /usr/local/sbin/infra-drift-check
    mode: "0755"
    owner: root
    group: root

- name: Install the known-benign list
  ansible.builtin.copy:
    content: "{{ infra_drift_check_known | join('\n') }}\n"
    dest: /etc/infra-drift-known.txt
    mode: "0644"

- name: Install the systemd service
  ansible.builtin.template:
    src: infra-drift-check.service.j2
    dest: /etc/systemd/system/infra-drift-check.service
    mode: "0644"
  register: infra_drift_service

- name: Install the systemd timer
  ansible.builtin.template:
    src: infra-drift-check.timer.j2
    dest: /etc/systemd/system/infra-drift-check.timer
    mode: "0644"
  register: infra_drift_timer

- name: Enable and start the timer
  ansible.builtin.systemd_service:
    name: infra-drift-check.timer
    enabled: true
    state: started
    daemon_reload: "{{ infra_drift_service.changed or infra_drift_timer.changed }}"
