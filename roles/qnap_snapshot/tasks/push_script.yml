################################################################################
# FILE: roles/qnap_snapshot/tasks/push_script.yml
################################################################################
---
# ansible.builtin.template/copy both need Python on the target - not
# available on the QNAP (confirmed live, see qnap_backup_dirs). Jinja2
# rendering itself happens on the controller regardless (it's not a
# remote operation), so the {{ }}/{% %} tags below are already
# substituted with real values before this ever reaches the QNAP - the
# quoted heredoc delimiter ('QNAP_SNAPSHOT_EOF') is what matters here,
# stopping the QNAP's own shell from expanding the script's *runtime*
# $variables (DATE, TODAY_DIR, etc.) while the file is being written.
# Always rewrites and reports changed - same pragmatic tradeoff as
# every other raw task in this role family: raw gives no structured
# diff to check against, and overwriting an identical file is harmless.
- name: Ensure the script directory exists
  ansible.builtin.raw: >-
    mkdir -p $(dirname {{ qnap_snapshot_script_path }})
  changed_when: true

# Rewritten 2026-10-03 (see roles/qnap_snapshot/HISTORY.md #5): the
# 2026-09-22 per-source dispatch structure (one script, one invocation
# per source via $1) is kept - that part's architecture was right. What
# was wrong: this whole script has been failing instantly on every
# single invocation since 2026-09-22, because `flock`, `ionice` and
# `nice` do not exist on QNAP's BusyBox (confirmed live) - the cron
# command line composed them unconditionally. Lock is now done with a
# plain `mkdir`-based lockdir inside the script itself (atomic on any
# POSIX filesystem, no external binary needed) instead of `flock` in
# the cron command; `ionice`/`nice` are dropped entirely - `rsync
# --bwlimit` is the only throttle mechanism left, which is also the
# only one of the three that was ever real.
- name: Push the snapshot script and make it executable
  ansible.builtin.raw: |
    cat > {{ qnap_snapshot_script_path }} <<'QNAP_SNAPSHOT_EOF'
    #!/bin/sh
    # Generated by day0-infra-build roles/qnap_snapshot - edits here
    # will be overwritten on the next Ansible run. Edit
    # variables/play/qnap_snapshot.yml and roles/qnap_snapshot instead.
    set -eu

    MODE="${1:-}"

    BACKUP_ROOT={{ qnap_backup_disk_root }}/active_backup/qnap-data
    DAILY_DIR="$BACKUP_ROOT/daily"
    WEEKLY_DIR="$BACKUP_ROOT/weekly"
    MONTHLY_DIR="$BACKUP_ROOT/monthly"
    MIRROR_DIR="$BACKUP_ROOT/mirror"

    DATE=$(date +%F)
    DOW=$(date +%u)          # 1=Mon .. 7=Sun
    DOM=$(date +%d)
    WEEK_TAG=$(date +%G-W%V)
    MONTH_TAG=$(date +%Y-%m)

    DAILY_KEEP={{ qnap_snapshot_daily_keep }}
    WEEKLY_KEEP={{ qnap_snapshot_weekly_keep }}
    MONTHLY_KEEP={{ qnap_snapshot_monthly_keep }}

    # Lock, replacing the 2026-09-22 flock cron-command wrapper -
    # confirmed live 2026-10-03 that flock does not exist on this
    # BusyBox, so every per-source cron trigger since then has died
    # on its first line without ever reaching rsync (see HISTORY.md
    # #5). mkdir is atomic on any POSIX filesystem including this
    # one, so it serves the same purpose without needing a binary
    # that is not there. Waits rather than skips - same slow-down-
    # do-not-stop semantics the old flock call documented but never
    # actually provided. A stale lock (PID in the lockdir no longer
    # alive - e.g. after an unclean QNAP reboot) is cleared rather
    # than waited on forever.
    LOCK_DIR=$(dirname {{ qnap_snapshot_script_path }})/.snapshot.lock
    acquire_lock() {
      while ! mkdir "$LOCK_DIR" 2>/dev/null; do
        lock_pid=$(cat "$LOCK_DIR/pid" 2>/dev/null || echo "")
        if [ -n "$lock_pid" ] && ! kill -0 "$lock_pid" 2>/dev/null; then
          echo "[*] Stale lock from PID $lock_pid, clearing: $(date)"
          rm -rf "$LOCK_DIR"
          continue
        fi
        sleep 15
      done
      echo $$ > "$LOCK_DIR/pid"
    }
    release_lock() {
      # Confirmed live 2026-10-03, twice: killing this script process
      # left a backgrounded long_running rsync, and even a plain
      # `kill -- -$$` on the whole process group, running as orphans -
      # rsync forks its own sender/receiver workers with new process
      # groups on this BusyBox, outside the reach of either approach.
      # Exactly the concurrent-rsync pileup that caused the
      # 2026-09-18/21 incident, with this very lock now free for a
      # fresh run to stack on top. Pattern-matching on SRC_PATH
      # instead, which is unique to the one source this invocation
      # ever touches - reaches every worker regardless of which
      # process group it landed in.
      if [ -n "${SRC_PATH:-}" ]; then
        ps w 2>/dev/null | grep "rsync .*${SRC_PATH}/" | grep -v grep | awk "{print \$1}" | while read -r orphan_pid; do
          kill "$orphan_pid" 2>/dev/null || true
        done
      fi
      rm -rf "$LOCK_DIR"
    }
    trap release_lock EXIT
    acquire_lock

    # Forces reclaim of the dentry/inode cache built up by this
    # source stat()-heavy tree-walk, rather than hoping the kernel
    # gets to it before the next source process starts. This is the
    # direct fix for the OOM root cause in HISTORY.md #1 - pacing alone
    # only gives the kernel an *opportunity*, this gives it a reason.
    drop_caches() {
      sync
      echo 2 > /proc/sys/vm/drop_caches 2>/dev/null || true
    }

    if [ "$MODE" = "--prune" ]; then
      prune_generations() {
        dir="$1"; keep="$2"
        i=0
        for d in $(ls -1t "$dir" 2>/dev/null); do
          i=$((i + 1))
          if [ "$i" -gt "$keep" ]; then
            rm -rf "${dir:?}/${d:?}"
          fi
        done
      }
      prune_generations "$DAILY_DIR" "$DAILY_KEEP"
      prune_generations "$WEEKLY_DIR" "$WEEKLY_KEEP"
      prune_generations "$MONTHLY_DIR" "$MONTHLY_KEEP"
      echo "[*] Prune complete: $(date)"
      exit 0
    fi

    case "$MODE" in
    {% for src in qnap_snapshot_sources %}
      {{ src.name }})
        SRC_PATH="{{ src.path }}"
        FLAG="{{ src.flag_file | default('') }}"
        SYNC_MODE="{{ src.mode | default('generational') }}"
        LONG_RUNNING="{{ '1' if src.long_running | default(false) else '0' }}"
        EXCLUDE_ARGS="{% for ex in src.excludes | default([]) %}--exclude={{ ex }} {% endfor %}"
        ;;
    {% endfor %}
      *)
        echo "usage: $0 <source>|--prune" >&2
        echo "  <source> is one of:{% for src in qnap_snapshot_sources %} {{ src.name }}{% endfor %}" >&2
        exit 1
        ;;
    esac

    # Streaming-aware throttle, folded in from a 2026-09-18 design
    # that never got committed (found uncommitted in the working tree
    # 2026-10-03, kept - see HISTORY.md #5). qnap_stream_watcher polls
    # the Jellyfin active-session API every couple of minutes and
    # touches/removes this flag file; this script only ever reads it.
    # Replaces the fixed ionice/nice/bwlimit combo from 2026-09-22
    # (neither ionice nor nice exist on this BusyBox anyway) with a
    # bandwidth cap that stays low only while someone is actively
    # watching something, not all the time.
    STREAM_FLAG={{ qnap_snapshot_throttle_flag_file }}
    BASE_BWLIMIT={{ qnap_snapshot_bwlimit_kbps }}
    STREAM_BWLIMIT={{ qnap_snapshot_throttle_bwlimit_kbps }}
    current_bwlimit() {
      if [ -f "$STREAM_FLAG" ]; then
        echo "$STREAM_BWLIMIT"
      else
        echo "$BASE_BWLIMIT"
      fi
    }

    # run_rsync <dest> <extra_args...> - wraps the actual transfer.
    # Plain sources: one rsync call at whatever bwlimit applied at
    # invocation. long_running sources (currently photos, media -
    # both can run for hours, long enough to span a full day of
    # streaming use) run rsync in the background and re-check the
    # flag every qnap_snapshot_throttle_recheck_seconds, restarting
    # with a new --bwlimit if it changed. A restart only re-copies the
    # file that was mid-transfer; everything already finished is
    # skipped via the same size/mtime check rsync always uses.
    run_rsync() {
      dest="$1"; shift
      if [ "$LONG_RUNNING" != "1" ]; then
        bwlimit=$(current_bwlimit)
        rsync -a --stats --bwlimit="$bwlimit" $EXCLUDE_ARGS "$@" "$SRC_PATH/" "$dest/"
        return $?
      fi
      set +e
      bwlimit=$(current_bwlimit)
      restart=1
      while [ "$restart" = "1" ]; do
        restart=0
        rsync -a --stats --bwlimit="$bwlimit" $EXCLUDE_ARGS "$@" "$SRC_PATH/" "$dest/" &
        rsync_pid=$!
        while kill -0 "$rsync_pid" 2>/dev/null; do
          sleep {{ qnap_snapshot_throttle_recheck_seconds }}
          new_bwlimit=$(current_bwlimit)
          if [ "$new_bwlimit" != "$bwlimit" ]; then
            if kill -0 "$rsync_pid" 2>/dev/null; then
              echo "[*] Streaming flag changed for $MODE, restarting rsync with bwlimit=$new_bwlimit (was $bwlimit)"
              kill "$rsync_pid" 2>/dev/null
              bwlimit="$new_bwlimit"
              restart=1
            fi
            break
          fi
        done
        wait "$rsync_pid" 2>/dev/null
        status=$?
      done
      set -e
      return "$status"
    }

    mkdir -p "$DAILY_DIR" "$WEEKLY_DIR" "$MONTHLY_DIR"

    # Interim mirror mode, added 2026-10-03 (HISTORY.md #6) for
    # sources that are actively migrating/churning right now (photos,
    # media) - the generational --link-dest diff below assumes the
    # source stays roughly stable between runs, which is not true
    # mid-migration and is what overloaded the box on 2026-09-18/21.
    # A flat, persistent, additive-only mirror sidesteps that
    # entirely: no per-run hardlink-tree rebuild, no deletes (so a
    # mid-migration rename/move never removes the only copy on the
    # backup disk before it is re-landed), one fixed destination
    # that just keeps catching up. --stats on every call prints how
    # many files moved this run - once that number stays near zero
    # for a few nights, the source has caught up and mode: mirror
    # can come back out of variables/play/qnap_snapshot.yml for that
    # source, returning it to normal generational backup with full
    # retention.
    if [ "$SYNC_MODE" = "mirror" ]; then
      SRC_MIRROR_DIR="$MIRROR_DIR/$MODE"
      mkdir -p "$SRC_MIRROR_DIR"
      echo "[*] Mirroring $MODE (interim mode while source is actively migrating - flat copy, no generations, no deletes): $(date)"
      run_rsync "$SRC_MIRROR_DIR"
      drop_caches
      echo "[*] $MODE mirror complete: $(date)"
      exit 0
    fi

    TODAY_DIR="$DAILY_DIR/$DATE"
    # Most recent *existing* daily generation, excluding today own
    # directory - matters now that a same-day source running later
    # (e.g. calibre-web at 01:59) would otherwise see the directory an
    # earlier source (e.g. books at 23:59) already created today and
    # wrongly diff against itself instead of yesterday real snapshot.
    PREV_DIR=$(ls -1dt "$DAILY_DIR"/*/ 2>/dev/null | grep -v "/${DATE}/\$" | head -1)
    mkdir -p "$TODAY_DIR"

    if [ -n "$FLAG" ]; then
      if [ -f "$SRC_PATH/$FLAG" ]; then
        echo "[*] Syncing $MODE (flagged pending)"
        if [ -n "$PREV_DIR" ] && [ -d "${PREV_DIR}${MODE}" ]; then
          run_rsync "$TODAY_DIR/$MODE" --exclude="$FLAG" --link-dest="${PREV_DIR}${MODE}"
        else
          run_rsync "$TODAY_DIR/$MODE" --exclude="$FLAG"
        fi
        rm -f "$SRC_PATH/$FLAG"
      else
        echo "[*] Skipping $MODE (nothing flagged since last run)"
      fi
    else
      echo "[*] Syncing $MODE"
      if [ -n "$PREV_DIR" ] && [ -d "${PREV_DIR}${MODE}" ]; then
        run_rsync "$TODAY_DIR/$MODE" --link-dest="${PREV_DIR}${MODE}"
      else
        run_rsync "$TODAY_DIR/$MODE"
      fi
    fi

    # Promotion looks up this source own most recent daily
    # generation rather than assuming $TODAY_DIR has it - a flag_file
    # source skipped tonight still needs to land in this week or
    # month tier, just from an older day folder instead of today.
    SRC_DAILY_DIR=$(ls -1dt "$DAILY_DIR"/*/$MODE 2>/dev/null | head -1)
    if [ -n "$SRC_DAILY_DIR" ]; then
      if [ "$DOW" = "7" ]; then
        echo "[*] Promoting $MODE to weekly"
        mkdir -p "$WEEKLY_DIR/$WEEK_TAG/$MODE"
        rsync -a --link-dest="$SRC_DAILY_DIR" "$SRC_DAILY_DIR/" "$WEEKLY_DIR/$WEEK_TAG/$MODE/"
      fi
      if [ "$DOM" = "01" ]; then
        echo "[*] Promoting $MODE to monthly"
        mkdir -p "$MONTHLY_DIR/$MONTH_TAG/$MODE"
        rsync -a --link-dest="$SRC_DAILY_DIR" "$SRC_DAILY_DIR/" "$MONTHLY_DIR/$MONTH_TAG/$MODE/"
      fi
    fi

    drop_caches
    echo "[*] $MODE snapshot complete: $(date)"
    QNAP_SNAPSHOT_EOF
    chmod +x {{ qnap_snapshot_script_path }}
  changed_when: true
