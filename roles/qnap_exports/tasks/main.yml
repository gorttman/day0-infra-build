################################################################################
# FILE: roles/qnap_exports/tasks/main.yml
################################################################################
---
# Runs before ensure_squash.yml deliberately: a new export needs to
# exist across all six sections before there's anything for
# ensure_squash.yml to check or fix on it.
- name: Include export-creation tasks
  ansible.builtin.include_tasks: create_export.yml

# Runs before ensure_squash.yml: ensure_acl.yml manages the full ACL
# (including squash) for exports whose whole client-rule set changes,
# not just the squash value on an unchanged rule set - see that file's
# own header comment for why these can't be two independent mechanisms
# touching the same export.
- name: Include full-ACL tasks
  ansible.builtin.include_tasks: ensure_acl.yml

- name: Include squash-setting tasks
  ansible.builtin.include_tasks: ensure_squash.yml

# Last, deliberately: the three tasks above reconcile the config file, so
# any edit they make has already been written by the time this compares
# the file's intent against what the server is actually serving.
- name: Include runtime-liveness tasks
  ansible.builtin.include_tasks:
    file: ensure_live.yml

# Under --check the fix tasks above are raw, which Ansible skips, so a drifted
# export would look like "nothing to do". The read-only probes DO run (they set
# check_mode: false), so summarise what they found. Never runs for real: a real
# run repairs the drift (and restarts NFS via the handler) in the tasks above.
- name: Report export drift found by the read-only probes (check mode only)
  ansible.builtin.debug:
    msg: >-
      {{ 'DRIFT qnap_exports:' if qnap_exports_drift | length > 0 else 'NO DRIFT qnap_exports' }}
      {{ qnap_exports_drift | join('; ') }}
  vars:
    qnap_exports_drift: >-
      {{
        (export_check.results | default([]) | selectattr('stdout', 'search', 'MISSING')
           | map(attribute='item') | map(attribute='path') | map('regex_replace', '^', 'export missing from config: ') | list)
        + (acl_check.results | default([]) | selectattr('stdout', 'search', 'MISMATCH')
           | map(attribute='item') | map(attribute='path') | map('regex_replace', '^', 'AllowIP differs: ') | list)
        + (squash_check.results | default([]) | selectattr('stdout', 'search', 'MISMATCH')
           | map(attribute='item') | map(attribute='path') | map('regex_replace', '^', 'squash differs: ') | list)
        + (qnap_nfs_acl | map(attribute='path') | reject('in', qnap_live_exports.stdout | default('')) | map('regex_replace', '^', 'not live on the running server: ') | list)
      }}
  when: ansible_check_mode
  changed_when: qnap_exports_drift | length > 0
