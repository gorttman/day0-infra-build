# Deliberately separate from variables/cli/hosts.ini: adding these hosts there
# would pull them into unrelated plays they must never run (e.g. "Apply ArgoCD
# bootstrap Application", which must only ever run once, from k8smaster).
[wlan_vip_nodes]
k8smaster ansible_connection=local
pinode-01 ansible_host=192.168.20.11 ansible_user=gorttman ansible_ssh_private_key_file=~/.ssh/pinode_cluster_ed25519
