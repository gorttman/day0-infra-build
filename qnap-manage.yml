################################################################################
# FILE: qnap-manage.yml
################################################################################
# Separate from day0-infra-build.yml deliberately: that playbook's plays
# manage the cluster nodes' relationship to the QNAP (DNS pins, host
# mounts - see the "QNAP client storage" play, --tags manage_qnap,
# still there, still the right home for it since it's referenced
# externally by that exact invocation). This one manages the QNAP NAS
# itself over SSH - a genuinely different category of thing, kept in
# its own file rather than folded into the existing playbook.
---
- name: QNAP backup directories
  hosts: qnap
  # No Python on the QNAP target (confirmed live 2026-08-07) - the
  # default implicit fact-gathering step needs it just as much as
  # file/copy/cron do, and fails before any of this play's own
  # raw-only tasks get a chance to run. Neither role here uses
  # gathered facts anyway.
  gather_facts: false
  tags:
    - manage_qnap_backup
  vars_files:
    - variables/common/set_environment.yml
    - variables/play/qnap_backup_directories.yml

  tasks:
    - name: Ensure backup-stream directories exist with correct ownership
      ansible.builtin.include_role:
        name: qnap_backup_dirs

- name: QNAP main pool directories
  hosts: qnap
  gather_facts: false
  tags:
    - manage_qnap_main_pool_dirs
  vars_files:
    - variables/common/set_environment.yml
    - variables/play/qnap_main_pool_dirs.yml

  tasks:
    - name: Ensure main-pool workload directories exist with correct ownership
      ansible.builtin.include_role:
        name: qnap_main_pool_dirs

- name: QNAP backup cron
  hosts: qnap
  gather_facts: false
  tags:
    - manage_qnap_cron
  vars_files:
    - variables/common/set_environment.yml
    # qnap_snapshot.yml supplies qnap_snapshot_script_path, referenced
    # by the qnap-data-snapshot cron entry below - each play has its
    # own isolated vars_files scope, so this has to be included here
    # too, not just in the snapshot play itself. qnap_stream_watcher.yml
    # supplies qnap_stream_watcher_script_path/_interval_minutes for
    # the qnap-stream-watcher entry below, same reason.
    - variables/play/qnap_snapshot.yml
    - variables/play/qnap_stream_watcher.yml
    - variables/play/qnap_backup_cron.yml

  tasks:
    - name: Ensure backup cron entries exist in the persistent crontab
      ansible.builtin.include_role:
        name: qnap_cron

- name: QNAP NFS export settings
  hosts: qnap
  gather_facts: false
  tags:
    - manage_qnap_exports
  vars_files:
    - variables/common/set_environment.yml
    - variables/play/qnap_nfs_exports.yml

  tasks:
    - name: Ensure managed NFS export settings match desired state
      ansible.builtin.include_role:
        name: qnap_exports

- name: QNAP data snapshot script
  hosts: qnap
  gather_facts: false
  tags:
    - manage_qnap_snapshot
  vars_files:
    - variables/common/set_environment.yml
    # qnap_backup_directories.yml supplies qnap_backup_disk_root - the
    # single source of truth for the disk's real path, shared with the
    # backup-directories play rather than duplicated here.
    - variables/play/qnap_backup_directories.yml
    - variables/play/qnap_snapshot.yml

  tasks:
    - name: Ensure the snapshot script is pushed and current
      ansible.builtin.include_role:
        name: qnap_snapshot

# Added 2026-09-18 - see roles/qnap_snapshot/HISTORY.md #4. Separate
# play (not folded into "QNAP data snapshot script" above) because it
# needs a task delegated to this control host's own kubectl access,
# which none of the other qnap-targeted plays in this file need.
- name: QNAP stream-aware backup throttle
  hosts: qnap
  gather_facts: false
  tags:
    - manage_qnap_stream_watcher
  vars_files:
    - variables/common/set_environment.yml
    - variables/play/qnap_snapshot.yml
    - variables/play/qnap_stream_watcher.yml

  tasks:
    - name: Fetch the Jellyfin API key already used by jellyfin-notify
      # Reuses arr-stack-wiring-secret's jellyfin_api_key rather than
      # issuing a new one - same key jellyfin-notify's CronJob already
      # mounts (arr-stack namespace). kubectl needs sudo on this
      # control host (confirmed live in-session, not a Python module
      # since none of this file's other tasks depend on one either).
      ansible.builtin.command:
        cmd: >-
          sudo kubectl get secret arr-stack-wiring-secret -n arr-stack
          -o jsonpath={.data.jellyfin_api_key}
      delegate_to: localhost
      become: false
      changed_when: false
      register: jellyfin_api_key_b64

    - name: Push the stream-activity watcher script
      ansible.builtin.include_role:
        name: qnap_stream_watcher
      vars:
        jellyfin_api_key: "{{ jellyfin_api_key_b64.stdout | b64decode }}"
