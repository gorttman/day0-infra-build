################################################################################
# FILE: variables/play/qnap_backup_cron.yml
################################################################################
---
# Persistent QNAP crontab file - NOT live crond state (`crontab -e`),
# which QTS does not reliably persist across reboots/firmware updates on
# its own. /etc/config/crontab is the flash-backed source QNAP reloads
# from on boot - same persistence pattern already confirmed for NFS
# exports (/etc/config/nfssetting, see docs/rebuild-runbook.md Step 5).
qnap_crontab_file: /etc/config/crontab

# name must be unique: it doubles as the idempotency marker (a trailing
# crontab comment), not just a label, so re-running the play doesn't
# duplicate the line.
#
# 03:00, deliberately between postgres-backup's 02:00 (day2-services
# apps/postgres) and the credentials rsync's 04:30
# (roles/qnap_client) - avoids all three ever overlapping.
qnap_cron_jobs:
  - name: qnap-data-snapshot
    schedule: "0 3 * * *"
    command: "{{ qnap_snapshot_script_path }} >> /share/CACHEDEV1_DATA/.scripts/qnap-snapshot.log 2>&1"
