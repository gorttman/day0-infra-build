################################################################################
# FILE: variables/play/qnap_backup_directories.yml
################################################################################
---
# The USB backup disk's real path on the QNAP's own filesystem - NOT the
# /backup NFS export path (that only means something to an NFS client;
# we're running these tasks over SSH directly on the QNAP itself). QNAP
# names external-storage mounts by device ID rather than share name;
# confirmed live via `ls /share/external/` (2026-08-07) - re-verify this
# if the disk is ever unplugged/reconnected, since the ID isn't
# guaranteed stable across that.
qnap_backup_disk_root: /share/external/DEV3302_1

# Every subdirectory a backup stream needs under the QNAP /backup export's
# active_backup/ staging area - never the export root itself, which still
# has an old, unverified rushed backup sitting on it from before this
# project existed (see day2-services project_qnap_backup_design memory).
# Add a stream here and re-run the play - no role/task changes needed.
#
# uid/gid: must match the consuming workload's own container uid -
# /backup is no_root_squash (see roles/qnap_exports), so whatever uid
# a pod's securityContext.runAsUser sets is exactly what reaches the
# server, unmapped. postgres-backup runs as 70:70 (the postgres image's
# own built-in uid, see day2-services/apps/postgres/postgres-backup-cronjob.yml).
#
# History, since this value has been wrong twice for two different
# reasons: this export was briefly all_squash (AnonUID=1000/GID=100)
# during initial debugging, which forced every write to that fixed
# pair regardless of container uid - so this was set to 1000:100 to
# match. That squash setting turned out to be the actual root cause of
# a separate, worse bug (kubelet's pod-level nfs: volumes failing
# outright) and was switched to no_root_squash 2026-08-09 - which
# silently broke this value, since 70:70 is what actually matters now
# and nothing here was updated to match until the next scheduled
# backup run would have failed (caught live 2026-08-10, not from a
# real failure). Lesson: an export's squash mode and this file's
# uid/gid values are coupled, changing one without checking the other
# is exactly how this regressed.
qnap_backup_dirs:
  - path: active_backup/postgres
    uid: 70
    gid: 70
  # pihole and calibre-web moved off active_backup/ and onto the main
  # pool 2026-08-13 - see variables/play/qnap_main_pool_dirs.yml and
  # day1-foundation apps/qnap-storage/README.md's migration section.
  # The old active_backup/pihole and active_backup/calibre-web
  # directories (and their qnap_backup_dirs entries here) were retired
  # at the same time - both now get real generational history via
  # qnap_snapshot_sources instead of a single-copy staging area.
