################################################################################
# FILE: variables/play/qnap_snapshot.yml
################################################################################
---
qnap_snapshot_script_path: /share/CACHEDEV1_DATA/.scripts/qnap-snapshot.sh

# Retention matches the DB backups' scheme (7 daily / 4 weekly / 13
# monthly - 12 completed months + the current in-progress one) for a
# consistent restore.sh mental model, not because the two datasets
# change at the same rate.
qnap_snapshot_daily_keep: 7
qnap_snapshot_weekly_keep: 4
qnap_snapshot_monthly_keep: 13

# Source list finalized 2026-08-10 (see day2-services
# project_qnap_backup_design memory for the full reasoning trail).
# Deliberately excludes: /backup itself (it's the destination disk,
# /share/external/DEV3302_1 - confirmed the same physical device,
# snapshotting it onto itself makes no sense), the top-level /downloads
# export and media's own downloads/ subdirectory (both in-progress
# staging, confirmed genuinely separate directories via inode
# comparison, not aliases of each other), /cold and /Public (never
# proposed).
#
# path is each export's real *local* filesystem path on the QNAP -
# confirmed live via SSH, not assumed from the client-facing NFS
# export name. immich's is a genuine surprise: the QNAP's own local
# directory is misspelled "immicc", not "immich" - the NFS export name
# clients mount is correctly spelled, only the underlying directory
# isn't. Left as-is rather than renamed, since renaming a live,
# already-exported directory is a separate, riskier change than this
# backup job needs to make.
qnap_snapshot_sources:
  - name: books
    path: /share/CACHEDEV1_DATA/books
    # Producer-driven change detection (books-pipeline touches this after
    # a real promotion) - see roles/qnap_snapshot/HISTORY.md #2. Only
    # source wired to this so far; the other 7 still sync unconditionally.
    flag_file: .snapshot-pending
  # Added 2026-09-04. 170G and previously in no backup at any tier -
  # missed rather than excluded, since every real exclusion is
  # documented in the comment above. This is the folder-based source
  # of truth for the Immich external library; the /immich share only
  # holds Immich's own library/thumbs/upload trees.
  - name: photos
    path: /share/CACHEDEV1_DATA/photos
  - name: vault
    path: /share/CACHEDEV1_DATA/vault
  - name: immich
    path: /share/CACHEDEV1_DATA/immicc
  - name: paperless
    path: /share/CACHEDEV1_DATA/paperless
  - name: inbox
    path: /share/CACHEDEV1_DATA/inbox
  - name: media
    path: /share/CACHEDEV1_DATA/media
    excludes:
      - downloads
  # Added 2026-08-13 - both previously lived under active_backup/ on
  # /backup itself (the excluded destination disk above), so neither
  # had any generational history. Moved to the main pool
  # (variables/play/qnap_main_pool_dirs.yml,
  # variables/play/qnap_nfs_exports.yml) specifically so they'd land
  # here like every other source.
  - name: pihole
    path: /share/CACHEDEV1_DATA/pihole
  - name: calibre-web
    path: /share/CACHEDEV1_DATA/calibre-web
