################################################################################
# FILE: variables/play/qnap_nfs_exports.yml
################################################################################
---
# The QNAP's own NFS export config, not exportfs/exports(5) - QTS keeps
# this in a flat ini-style file, one line per export per section
# ([Access], [AllowIP], [Permission], [SquashOption], [AnonUID],
# [AnonGID]), reloaded via `/etc/init.d/nfs restart`. Confirmed live
# 2026-08-08/09. Only managing SquashOption here for now - the one
# setting that's already bitten this project twice (root_squash denying
# writes, then all_squash silently remapping every client uid
# regardless of container securityContext). Extend with the other
# sections later if a similar need shows up; not built preemptively.
qnap_nfs_config_file: /etc/config/nfssetting

# path is the file's own local filesystem path for the share (not the
# NFS export name a client mounts - e.g. /backup as a client-facing
# path corresponds to /share/external/DEV3302_1 here). value is the
# exact desired line content, one value per allowed host in [AllowIP]
# order (currently 2: k8smaster, pinode-01) - matches the file's own
# comma-separated-per-host format, not a single scalar.
#
# no_root_squash chosen deliberately over all_squash: this export needs
# real per-consumer ownership (the QNAP-side directory owner has to
# match whatever uid the writing container actually runs as), not
# every write forced to one fixed uid regardless of who's writing.
# Confirmed live 2026-08-08 that all_squash was the root cause of
# kubelet's own pod-level nfs: volume mechanism failing writes here -
# see day2-services project_qnap_backup_design memory for the full
# debugging trail.
qnap_nfs_squash:
  - path: /share/external/DEV3302_1
    value: no_root_squash,no_root_squash
  - path: /share/CACHEDEV1_DATA/pihole
    value: no_root_squash,no_root_squash
  - path: /share/CACHEDEV1_DATA/calibre-web
    value: no_root_squash,no_root_squash

# Full-ACL managed exports (roles/qnap_exports/tasks/ensure_acl.yml) -
# a MODIFY-only mechanism for an export that already exists: it checks
# each section's current line against the desired one and sed-replaces
# it if different, but a sed `s|^path = .*$|...|` matches nothing if
# the line is entirely absent, not just wrong. Real gap found live
# 2026-08-22: /backup's entire nfssetting registration (all 6 sections)
# was found completely gone after a QNAP reboot - this list alone would
# have silently done nothing to fix that, since there was no existing
# line to replace. Kept empty for now - nothing currently needs
# modify-only handling of an export whose line always exists but drifts
# in value; use this if that situation comes up again, but see
# qnap_nfs_new_exports below for anything that might need to be
# (re)created from nothing, which is the more robust default.
qnap_nfs_acl: []

# New exports created from scratch (roles/qnap_exports/tasks/create_export.yml) -
# checks each section for the path's presence and inserts a fresh line
# if missing, which is why /backup lives here now rather than in
# qnap_nfs_acl above: found live 2026-08-22 that a QNAP reboot wipes an
# EXTERNAL/USB disk's entire nfssetting registration (all 6 sections),
# even though the disk itself, its smb.conf Shared Folder registration,
# and every INTERNAL-pool export (pihole, calibre-web, confirmed
# unaffected by the same reboot) all survive fine. QTS evidently treats
# external storage as needing fresh NFS permission registration on
# every boot, unlike fixed internal-pool volumes - re-running this same
# Ansible (`qnap-manage.yml --tags manage_qnap_exports`) after any
# future QNAP reboot is the fix, not a one-off manual patch. ACL here
# matches the 2026-08-14 widening: both home subnets, rw +
# no_root_squash, for a traveling DHCP client (a Mac) rather than
# pinning specific IPs that won't survive a lease change - see
# day2-services project_qnap_backup_design memory. Deliberately LAN-only,
# not something to copy for an internet-facing export.
qnap_nfs_new_exports:
  - path: /share/external/DEV3302_1
    allow_ip: "192.168.1.0/24,192.168.2.0/24"
    permission: "rw,rw"
    squash: "no_root_squash,no_root_squash"
    anon_uid: "1000,1000"
    anon_gid: "100,100"
  - path: /share/CACHEDEV1_DATA/pihole
    allow_ip: "192.168.1.10,192.168.1.11"
    permission: "rw,rw"
    squash: "no_root_squash,no_root_squash"
    anon_uid: "65534,65534"
    anon_gid: "65534,65534"
  - path: /share/CACHEDEV1_DATA/calibre-web
    allow_ip: "192.168.1.10,192.168.1.11"
    permission: "rw,rw"
    squash: "no_root_squash,no_root_squash"
    anon_uid: "65534,65534"
    anon_gid: "65534,65534"
