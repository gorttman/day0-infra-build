git_user: oauth2
git_org: gorttman
git_token: "{{ lookup('file', playbook_dir + '/credentials/git-pat/token.txt') | trim }}"
variable_files: 
  - name: workspace
    path: common
  - name: day0_bootstrap_secrets
    path: common 
  - name: git
    path: common

argocd_version: "v3.2.0"

kubeconfig: /etc/rancher/k3s/k3s.yaml
bootstrap_app_path: "{{ staging_dir }}/argo_bootstrap.yml"
argocd_https_port: 30443
bootstrap_repos:
  - name: day0-bootstrap
    repo: "https://github.com/gorttman/day0-bootstrap.git"
    rev: main
    path: apps
  - name: day1-foundation
    repo: https://github.com/gorttman/day1-foundation.git
    rev: main
    path: apps
  - name: day2-services
    repo: https://github.com/gorttman/day2-services.git
    rev: main
    path: apps

config_repos:
  - name: dhcpd-config
    rev: main
    path: apps
    repo: https://github.com/gorttman/dhcpd-conf.git
  - name: dns-config
    rev: main
    path: apps
    repo: https://github.com/gorttman/dns-conf.git

backend_vlan_ip: "192.168.1.10"
backend_vlan_prefix: "27"

# Both Pi-holes (split-horizon DNS for *.i3sec.com.au) first, then
# 1.1.1.2 as the last resort - not a replacement, so a node still
# resolves if both Pi-holes are down. That last entry is load-bearing:
# 2026-09-03 proved a node whose only nameserver is Pi-hole's own VIP cannot
# pull the Pi-hole image, so it cannot start the very thing it depends
# on. Exactly 3 entries, and that is the ceiling twice over - glibc reads
# at most 3 from resolv.conf, and community.general.nmcli's dns4
# parameter caps there too. The UDM (192.168.2.1) is the entry that had
# to give way.
# 2026-09-03: moved to the Trusted (VLAN20) resolver addresses. Pi-hole left
# the WLAN entirely - same last octets, new subnet - and wlan0 is now down on
# both nodes, so a WLAN-subnet resolver address would be unreachable from a
# rebuilt node. See wlan-vips.yml (deprecated) for why the WLAN VIPs existed.
wifi_mgmt_dns:
  - "192.168.20.245"
  - "192.168.20.246"
  - "1.1.1.2"

helper_scripts:
  - seal_secret.sh
# Removed in favor of kubernetes cron job
#  - backup-sealed-secrets.sh
