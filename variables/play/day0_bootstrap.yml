git_user: oauth2
git_org: gorttman
git_token: "{{ lookup('file', playbook_dir + '/credentials/git-pat/token.txt') | trim }}"
variable_files: 
  - name: workspace
    path: common
  - name: day0_bootstrap_secrets
    path: common 
  - name: git
    path: common

argocd_version: "v3.2.0"

kubeconfig: /etc/rancher/k3s/k3s.yaml
bootstrap_app_path: "{{ staging_dir }}/argo_bootstrap.yml"
argocd_https_port: 30443
dash_https_port: 30444
bootstrap_repos:
  - name: day0-bootstrap
    repo: "https://github.com/gorttman/day0-bootstrap.git"
    rev: main
    path: apps
  - name: day1-foundation
    repo: https://github.com/gorttman/day1-foundation.git
    rev: main
    path: apps
  - name: day2-services
    repo: https://github.com/gorttman/day2-services.git
    rev: main
    path: apps

config_repos:
  - name: dhcpd-config
    rev: main
    path: apps
    repo: https://github.com/gorttman/dhcpd-conf.git
  - name: dns-config
    rev: main
    path: apps
    repo: https://github.com/gorttman/dns-conf.git

backend_vlan_ip: "192.168.1.10"
backend_vlan_prefix: "27"

# Host route to the Dream Machine's own management address
# (192.168.2.1, the Default network) via the backend VLAN's gateway
# (192.168.1.1 - confirmed live, see day1-foundation apps/unifi-tf
# HISTORY.md) instead of wlan0. Without this, every cluster node
# reaches the UniFi API over Wi-Fi, since wlan0 sits directly on
# 192.168.2.0/24 while end0 only has the on-link backend-vlan route -
# the kernel always prefers the more specific/directly-connected
# interface. That's a real risk for unifi-tf's Terraform applies:
# a WLAN-disrupting change (a radio update, the WLAN resource itself)
# could cut the very control path being used to apply it, mid-apply.
# Same fixed IP/gateway on every node - not host-specific, unlike
# backend_vlan_ip above. Deployed live on k8smaster and pinode-01
# 2026-08-04 via nmcli directly (survives reboot - it's a connection
# property, not an ephemeral route); this task codifies it for the
# next from-scratch rebuild.
backend_vlan_routes:
  - "192.168.2.1/32 192.168.1.1"

helper_scripts:
  - seal_secret.sh
# Removed in favor of kubernetes cron job
#  - backup-sealed-secrets.sh
