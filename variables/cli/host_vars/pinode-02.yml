---
# NetworkManager's stock profile name on this node (the Pi OS default).
node_primary_conn: "Wired connection 1"
node_primary_ifname: eth0
node_iot_leg:
  enabled: true
  conn_name: iot40
  vlan_id: 40
  parent: eth0
  address: 192.168.40.12/24
# sshd socket bound to the Trusted address only ("" = leave sshd alone)
node_ssh_listen_address: 192.168.20.12
# host firewall table guarding the IoT leg
node_iot_guard_enabled: true

# systemd hygiene (roles/node_systemd_hygiene): first-boot dialog, networkd, cloud-init
node_hygiene_enabled: true
