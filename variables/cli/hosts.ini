[localhost]
k8smaster ansible_connection=local
localhost ansible_connection=local

# First real SSH-connected inventory host in this repo - everything else
# above runs locally on k8smaster. Connection details (host/user) live in
# group_vars/qnap.yml, not inline here, matching how every other
# QNAP-related IP in this repo (qnap_wired_ip, nfs_server_ip,
# backend_vlan_ip) is a named var rather than a literal. Uses key-based SSH auth via ~/.ssh/qnap_ansible_ed25519, which
# group_vars/qnap.yml sets as ansible_ssh_private_key_file. Verified
# working 2026-09-04. Testing with the default key instead gives
# Permission denied and makes it look like no key auth exists - an
# earlier version of this comment said exactly that and was wrong. No
# ansible_python_interpreter set deliberately: qnap_backup_dirs only
# uses ansible.builtin.raw, which needs no Python on the target, and
# QNAP's stock BusyBox shell doesn't have one confirmed available.
[qnap]
qnap
