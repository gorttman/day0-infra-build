################################################################################
# FILE: unifi-tf-apply.yml
################################################################################
# Relocated here from day1-foundation 2026-08-10, deliberately OUT of
# ArgoCD's GitOps/automated-sync path entirely. This app manages the
# live household UDM/gateway/APs - the same class of thing a real
# incident already proved is too dangerous to apply unattended - see
# roles/unifi_tf_apply/HISTORY.md #5 for the full incident.
#
# All the actual logic lives in the unifi_tf_apply role (thin playbook,
# same pattern as qnap-manage.yml) - see
# roles/unifi_tf_apply/{README,HISTORY}.md for the design rationale,
# and roles/unifi_tf_apply/files/terraform/ for the .tf files
# themselves.
#
# Run with:
#   ansible-playbook unifi-tf-apply.yml                           # plan only
#   ansible-playbook unifi-tf-apply.yml -e unifi_tf_do_apply=true  # plan + apply, refuses any destroy

- name: Apply UniFi Terraform config (plan always; apply only when explicitly requested)
  hosts: k8smaster
  gather_facts: false
  tags:
    - manage_unifi_tf

  tasks:
    - name: Run the unifi-tf apply role
      ansible.builtin.include_role:
        name: unifi_tf_apply
